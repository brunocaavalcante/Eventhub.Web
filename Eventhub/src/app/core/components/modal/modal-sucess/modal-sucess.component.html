<div class="modal-success-card">
  @if(data?.showIcon) {
    <div class="modal-success-icon">
      <div class="icon-circle">
        <mat-icon>check</mat-icon>
      </div>
    </div>
  }

  <h2 class="modal-success-title">{{ title }}</h2>
  <p class="modal-success-message">{{ message }}</p>

  <div class="modal-success-actions">
    <button mat-raised-button class="ok-btn" (click)="close()">{{ okLabel }}</button>
  </div>
</div>
