<div class="modal-error-card">
  <div class="modal-error-content">
    <div class="modal-error-icon">
      <div class="icon-circle">
        <mat-icon>error_outline</mat-icon>
      </div>
    </div>
    
    <h2 class="modal-error-title">{{ title }}</h2>
    <p class="modal-error-message">{{ message }}</p>
    
    <div class="modal-error-actions">
      <button mat-raised-button class="ok-btn" (click)="close()">{{ okLabel }}</button>
    </div>
  </div>
</div>
