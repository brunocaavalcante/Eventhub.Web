<div class="modal-confirm-card">
    <!-- Header Icon -->
    <div class="modal-confirm-icon">
        <div class="icon-circle">
            <svg class="icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
        </div>
    </div>

    <!-- Header Text -->
    <header class="modal-header">
        <h1 class="modal-confirm-title">{{ title }}</h1>
    </header>

    <!-- Message Content -->
    <div class="modal-confirm-message" [innerHTML]="message"></div>

    <!-- Footer Actions -->
    <footer class="modal-confirm-actions">
        <button mat-button class="cancel-btn" (click)="cancel()">{{ cancelLabel }}</button>
        <button mat-raised-button class="confirm-btn" (click)="confirm()">{{ confirmLabel }}</button>
    </footer>
</div>
