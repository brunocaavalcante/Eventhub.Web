<div class="modal-container">
  <h2>Configurar Fundo do Convite</h2>
  
  <div class="upload-section">
    <button mat-raised-button color="primary" class="upload-btn">
      <mat-icon>upload</mat-icon>
      Selecionar Imagem
      <input type="file" accept="image/*" (change)="onFileSelected($event)" class="file-input" />
    </button>
    
    @if(backgroundImage) {
      <button mat-button color="warn" (click)="removeImage()">
        <mat-icon>delete</mat-icon>
        Remover Imagem
      </button>
    }
  </div>

  @if(backgroundImage) {
    <div class="preview-section">
      <h3>Prévia</h3>
      <div class="preview-box" [ngStyle]="previewStyle"></div>
    </div>

    <div class="controls-section">
      <div class="control-group">
        <label>Opacidade: {{opacity}}%</label>
        <mat-slider min="0" max="100" step="1" showTickMarks discrete>
          <input matSliderThumb [(ngModel)]="opacity">
        </mat-slider>
      </div>

      <div class="control-group">
        <label>Posição</label>
        <div class="button-group">
          <button mat-button [class.active]="backgroundPosition === 'top'" (click)="backgroundPosition = 'top'">
            Topo
          </button>
          <button mat-button [class.active]="backgroundPosition === 'center'" (click)="backgroundPosition = 'center'">
            Centro
          </button>
          <button mat-button [class.active]="backgroundPosition === 'bottom'" (click)="backgroundPosition = 'bottom'">
            Base
          </button>
        </div>
      </div>
    </div>
  }

  <div class="actions">
    <button mat-button (click)="fechar()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="salvar()">Aplicar</button>
  </div>
</div>
