<div class="container">
    <h2>Editar Item do Template</h2>
    <mat-form-field appearance="outline" class="enviar-convite-field">
        <textarea matInput name="textoRich" [(ngModel)]="item.texto" [style]="item.styles"></textarea>
       
    </mat-form-field>
    <div class="barra-ferramentas">
        <div class="style-text">
            <button type="button" mat-icon-button matTooltip="Negrito" [class.active]="isStyleActive('font-weight','bold')" (click)="toggleStyle('font-weight','bold')"> <mat-icon>format_bold</mat-icon> </button>
            <button type="button" mat-icon-button matTooltip="Itálico" [class.active]="isStyleActive('font-style','italic')" (click)="toggleStyle('font-style','italic')"> <mat-icon>format_italic</mat-icon> </button>
            <button type="button" mat-icon-button matTooltip="Sublinhado" [class.active]="isStyleActive('text-decoration','underline')" (click)="toggleStyle('text-decoration','underline')"> <mat-icon>format_underlined</mat-icon> </button>
            <button type="button" mat-icon-button matTooltip="Alinhar à esquerda" [class.active]="isStyleActive('text-align','left')" (click)="setAlignment('left')"> <mat-icon>format_align_left</mat-icon> </button>
            <button type="button" mat-icon-button matTooltip="Centralizar" [class.active]="isStyleActive('text-align','center')" (click)="setAlignment('center')"> <mat-icon>format_align_center</mat-icon> </button>
            <button type="button" mat-icon-button matTooltip="Alinhar à direita" [class.active]="isStyleActive('text-align','right')" (click)="setAlignment('right')"> <mat-icon>format_align_right</mat-icon> </button>
        </div>
        <hr>
        <div class="size-text">
            <span>Tamanho do Texto</span>
            <button type="button" mat-icon-button (click)="updateFontSize(-2)"> <mat-icon>text_decrease</mat-icon> </button>

            <input matInput type="number" min="8" max="72" [ngModel]="fontSize" (ngModelChange)="setFontSize($event)" name="fontSize" />

            <button type="button" mat-icon-button (click)="updateFontSize(2)"> <mat-icon>text_increase</mat-icon> </button>
        </div>

        <div class="letter-spacing">
            <span>Espaçamento</span>
            <button type="button" mat-icon-button (click)="updateLetterSpacing(-0.5)"> <mat-icon>chevron_left</mat-icon> </button>
            <input matInput type="number" step="0.1" min="-5" max="20" [ngModel]="letterSpacing" (ngModelChange)="setLetterSpacing($event)" name="letterSpacing" />
            <button type="button" mat-icon-button (click)="updateLetterSpacing(0.5)"> <mat-icon>chevron_right</mat-icon> </button>
        </div>

        <div class="line-height">
            <span>Altura da Linha</span>
            <button type="button" mat-icon-button (click)="updateLineHeight(-0.1)"> <mat-icon>expand_less</mat-icon> </button>
            <input matInput type="number" step="0.1" min="1" max="3" [ngModel]="lineHeight" (ngModelChange)="setLineHeight($event)" name="lineHeight" />
            <button type="button" mat-icon-button (click)="updateLineHeight(0.1)"> <mat-icon>expand_more</mat-icon> </button>
        </div>

        <div class="font-family">
            <span>Fonte</span>
            <select name="fontFamily" [ngModel]="fontFamily" (ngModelChange)="setFontFamily($event)">
                @for (font of fontOptions; track font.value) {
                <option [value]="font.value">{{font.label}}</option>
                }
            </select>
        </div>

        <div class="color-text">
            <span>Cor do Texto</span>
            <input type="color" name="textColor" [(ngModel)]="textColor" (ngModelChange)="updateColor($event)" aria-label="Selecionar cor do texto" />
        </div>
        <div class="btns">
            <button mat-button color="warn" (click)="fecha()">Cancelar</button>
            <button mat-button color="primary" (click)="salvar()">Salvar</button>
        </div>
    </div>
</div>
