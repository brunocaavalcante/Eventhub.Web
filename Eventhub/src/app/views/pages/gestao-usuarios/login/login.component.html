<div class="login-page">
    <div class="login-left">
        <h2 class="login-welcome">Bem-vindo(a) de volta!</h2>
        <p class="login-desc">Faça login para continuar organizando seus eventos.</p>
        <form class="login-form">
            <label for="email">Email ou nome de usuário</label>
            <input id="email" type="text" placeholder="seuemail@exemplo.com" />
            <label for="senha">Senha <a class="forgot-link" href="#">Esqueceu sua senha?</a></label>
            <input id="senha" type="password" placeholder="********" />
            <button type="submit" class="login-btn">Entrar</button>
        </form>
        <div class="login-register">
            Não tem uma conta? <a class="register-link" href="#">Cadastre-se</a>
        </div>
    </div>
    <div class="login-right">
        <div class="login-img-placeholder">
            <img src="assets/imagens/login.png" alt="Ilustração de login" />
        </div>
    </div>
</div>
