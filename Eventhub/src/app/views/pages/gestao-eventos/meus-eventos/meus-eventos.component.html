<div class="empty-event-container" *ngIf="meusEventos.length === 0">
    <img src="assets/imagens/empty-event.png" alt="Sem eventos" class="empty-event-img" />
    <h2 class="empty-title">Olá! Parece que você ainda não<br>tem eventos criados.</h2>
    <p class="empty-desc">Comece a organizar seu evento agora mesmo!</p>
    <button mat-button class="empty-btn">
        Criar Meu Primeiro Evento
    </button>
</div>
